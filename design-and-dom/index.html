<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- tailwind-css -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="m-1">
    <!-- comment section -->
    <section id="comment-history">

      
    </section>
    <!-- button section -->
    <section class="flex gap-4 mt-20 mb-20 justify-center items-center">
      <input id="comment-input" class="outline" type="text" value="" />
      <button
        id="like-button"
        class="bg-cyan-700 px-6 py-3 rounded-lg text-white btn-primary"
      >
        <span id="like-number"> 0 </span> Like
      </button>

      <button
        id="comment-button"
        class="bg-cyan-700 px-6 py-3 rounded-lg text-white btn-primary"
      >
        Comment
      </button>
      <button class="bg-cyan-700 px-6 py-3 rounded-lg text-white btn-primary">
        Share
      </button>
    </section>

    <!-- hero section -->
    <section class="hero-section md:flex hidden">
      <aside class="w-full md:w-1/2 flex justify-center items-center">
        <div class="p-4 md:p-8 lg:p-12 xl:p-16">
          <h1>A Happier Pet .A Happier You</h1>
          <p>
            Lorem ipsum, dolor sit amet consectetur adipisicing elit. Beatae
            quod minus quos excepturi iste. Voluptatum soluta ipsam labore eum
            vitae? Ratione ex consequatur amet eius.
          </p>
          <button class="bg-black text-white p-3 rounded-lg mt-4">
            Learn More
          </button>
        </div>
      </aside>

      <!-- hero image -->
      <img
        id="aqurium-img"
        class="w-full md:w-1/2"
        src="./images/aqurium.jpg"
        alt=""
      />
    </section>

    <!-- js file -->
    <script src="./index.js"></script>
  </body>
</html>
